<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <rect width="180" height="180" fill="black"/>
  <g transform="translate(90, 90)">
    <!-- Medical cross -->
    <rect x="-12" y="-40" width="24" height="80" fill="white"/>
    <rect x="-40" y="-12" width="80" height="24" fill="white"/>
    <!-- Paw motif integrated -->
    <!-- Central pad -->
    <ellipse cx="0" cy="8" rx="16" ry="14" fill="black"/>
    <ellipse cx="0" cy="8" rx="14" ry="12" fill="white"/>
    <!-- Toe pads -->
    <ellipse cx="-10" cy="-6" rx="8" ry="10" fill="black" transform="rotate(-25 -10 -6)"/>
    <ellipse cx="-10" cy="-6" rx="6" ry="8" fill="white" transform="rotate(-25 -10 -6)"/>
    <ellipse cx="-3" cy="-12" rx="8" ry="10" fill="black" transform="rotate(-10 -3 -12)"/>
    <ellipse cx="-3" cy="-12" rx="6" ry="8" fill="white" transform="rotate(-10 -3 -12)"/>
    <ellipse cx="3" cy="-12" rx="8" ry="10" fill="black" transform="rotate(10 3 -12)"/>
    <ellipse cx="3" cy="-12" rx="6" ry="8" fill="white" transform="rotate(10 3 -12)"/>
    <ellipse cx="10" cy="-6" rx="8" ry="10" fill="black" transform="rotate(25 10 -6)"/>
    <ellipse cx="10" cy="-6" rx="6" ry="8" fill="white" transform="rotate(25 10 -6)"/>
  </g>
</svg>
